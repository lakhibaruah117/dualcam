name: Build IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project DualCam.xcodeproj -scheme DualCam -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - run: mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/DualCam.app Payload/ && zip -qr DualCam.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: DualCam-ipa
          path: DualCam.ipa
